name: validate

on:
  push:
  pull_request:

jobs:
  smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile
        run: python -m py_compile scripts/qa_common.py scripts/init_workspace.py scripts/validate_workspace.py scripts/build_report.py tests/check_skill.py tests/smoke_test.py

      - name: Check skill package
        run: python tests/check_skill.py

      - name: End-to-end smoke test
        run: python tests/smoke_test.py
